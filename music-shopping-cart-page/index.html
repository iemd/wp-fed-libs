<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 17. Build a Music Shopping Cart Page -->
    <title>Music Shopping Cart Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-900 text-white">
    <h1 class="text-3xl text-center my-8">Music Shopping Cart Page</h1>
    <main id="shopping-cart-container" class="flex flex-col lg:flex-row items-center gap-8">
        <div id="products-container" class="w-full md:w-2/3 px-4">

            <div
                class="card flex flex-col lg:flex-row items-center gap-6 p-4 my-8 border border-green-200 bg-green-800">
                <h2 class="text-lg lg:w-1/2">Bansuri / Flute</h2>
                <div class="btn-container flex items-center lg:w-1/4">
                    <button type="button" aria-label="Decrease quantity"
                        class="decrement-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">-</span>
                    </button>
                    <span class="quantity mx-2">1</span>
                    <button type="button" aria-label="Increase quantity"
                        class="increment-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">+</span>
                    </button>
                </div>
                <p class="price lg:w-1/6 text-right">$40.00</p>
                <button class="remove-button bg-red-700 px-2 py-1 hover:bg-red-800">Remove</button>
            </div>

            <div
                class="card flex flex-col lg:flex-row items-center gap-6 p-4 my-8 border border-green-200 bg-green-800">
                <h2 class="text-lg lg:w-1/2">Tabla</h2>
                <div class="btn-container flex items-center lg:w-1/4">
                    <button type="button" aria-label="Decrease quantity"
                        class="decrement-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">-</span>
                    </button>
                    <span class="quantity mx-2">1</span>
                    <button type="button" aria-label="Increase quantity"
                        class="increment-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">+</span>
                    </button>
                </div>
                <p class="price lg:w-1/6 text-right">$450.00</p>
                <button class="remove-button bg-red-700 px-2 py-1 hover:bg-red-800">Remove</button>
            </div>

            <div
                class="card flex flex-col lg:flex-row items-center gap-6 p-4 my-8 border border-green-200 bg-green-800">
                <h2 class="text-lg lg:w-1/2">Sitar</h2>
                <div class="btn-container flex items-center lg:w-1/4">
                    <button type="button" aria-label="Decrease quantity"
                        class="decrement-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">-</span>
                    </button>
                    <span class="quantity mx-2">1</span>
                    <button type="button" aria-label="Increase quantity"
                        class="increment-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">+</span>
                    </button>
                </div>
                <p class="price lg:w-1/6 text-right">$1480.00</p>
                <button class="remove-button bg-red-700 px-2 py-1 hover:bg-red-800">Remove</button>
            </div>

            <div
                class="card flex flex-col lg:flex-row items-center gap-6 p-4 my-8 border border-green-200 bg-green-800">
                <h2 class="text-lg lg:w-1/2">Harmonium</h2>
                <div class="btn-container flex items-center lg:w-1/4">
                    <button type="button" aria-label="Decrease quantity"
                        class="decrement-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">-</span>
                    </button>
                    <span class="quantity mx-2">1</span>
                    <button type="button" aria-label="Increase quantity"
                        class="increment-btn bg-green-800 hover:bg-green-700 border border-green-200 py-1 px-3">
                        <span aria-hidden="true">+</span>
                    </button>
                </div>
                <p class="price lg:w-1/6 text-right">$850.00</p>
                <button class="remove-button bg-red-700 px-2 py-1 hover:bg-red-800">Remove</button>
            </div>
        </div>

        <div id="order-summary-container"
            class="w-full border border-green-200 bg-green-800 p-8 md:w-1/3 mt-8 lg:mt-0 rounded-lg">
            <h2 class="text-2xl mb-4">Order Summary</h2>
            <ul>
                <li>
                    <span id="subtotal" class="font-semibold text-lg">Subtotal:</span>
                    <span>$2820.00</span>
                </li>
                <li class="my-6">
                    <span id="shipping" class="font-semibold text-lg">Shipping:</span>
                    <span>Calculated in checkout</span>
                </li>
                <li>
                    <span id="total" class="font-semibold text-lg">Total:</span>
                    <span id="total-amount">$2820.00</span>
                </li>
            </ul>
            <a href="#"
                class="text-center mx-auto mt-4 block px-5 py-2.5 bg-blue-600 hover:bg-blue-700 font-medium">Checkout</a>
        </div>
    </main>
</body>

</html>
