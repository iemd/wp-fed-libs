<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 18. Design a Photography Exhibit (Certification Project) -->
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-800 text-stone-400 min-h-screen">
    <h1 class="text-4xl font-bold text-center my-12">Photography Exhibit</h1>
    <main class="main-container grid grid-cols-1 md:grid-cols-3 gap-8 px-4">
        <figure class="card bg-slate-900 border border-stone-400 rounded-lg p-4">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="Ancient Colosseum"
                class="h-48 w-full object-cover rounded-md mb-4">
            <figcaption>
                <h2 class="subheading font-semibold text-lg mb-2">Colosseum, Rome</h2>
                <p class="description text-sm mb-4">
                    There is so much history and beauty. The light hits it just right.
                </p>
                <div class="grid grid-cols-2 gap-4">
                    <button class="bg-slate-800 hover:bg-slate-700 border border-stone-400 py-1 px-2 rounded-md">
                        Like
                    </button>
                    <a href="#"
                        class="bg-stone-400 hover:bg-stone-300 text-slate-900 font-semibold text-center py-1 px-2 rounded-md">
                        View Details
                    </a>
                </div>
            </figcaption>
        </figure>

        <figure class="card bg-slate-900 border border-stone-400 rounded-lg p-4">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="Alpine Mountains"
                class="h-48 w-full object-cover rounded-md mb-4">
            <figcaption>
                <h2 class="subheading font-semibold text-lg mb-2">The Alps</h2>
                <p class="description text-sm mb-4">
                    The mountains go on forever and the view is breathtaking.
                </p>
                <div class="grid grid-cols-2 gap-4">
                    <button class="bg-slate-800 hover:bg-slate-700 border border-stone-400 py-1 px-2 rounded-md">
                        Like
                    </button>
                    <a href="#"
                        class="bg-stone-400 hover:bg-stone-300 text-slate-900 font-semibold text-center py-1 px-2 rounded-md">
                        View Details
                    </a>
                </div>
            </figcaption>
        </figure>

        <figure class="card bg-slate-900 border border-stone-400 rounded-lg p-4">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="Calm Sea"
                class="h-48 w-full object-cover rounded-md mb-4">
            <figcaption>
                <h2 class="subheading font-semibold text-lg mb-2">Seascape</h2>
                <p class="description text-sm mb-4">
                    The water was still, the air was cool and the feeling is pure peace.
                </p>
                <div class="grid grid-cols-2 gap-4">
                    <button class="bg-slate-800 hover:bg-slate-700 border border-stone-400 py-1 px-2 rounded-md">
                        Like
                    </button>
                    <a href="#"
                        class="bg-stone-400 hover:bg-stone-300 text-slate-900 font-semibold text-center py-1 px-2 rounded-md">
                        View Details
                    </a>
                </div>
            </figcaption>
        </figure>
    </main>
</body>

</html>
